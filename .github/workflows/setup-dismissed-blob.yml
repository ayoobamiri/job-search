name: One-off create dismissed-jobs blob
on: workflow_dispatch
jobs:
  create-blob:
    runs-on: ubuntu-latest
    steps:
      - name: Check CORS headers with a browser-like Origin
        run: |
          APPKEY="j3phzvnq"
          echo "---- GetValue with Origin header (simulating a browser cross-origin request) ----"
          curl -s -D - -o /dev/null \
            -H "Origin: https://ayoobamiri.github.io" \
            "https://keyvalue.immanuel.co/api/KeyVal/GetValue/$APPKEY/probe-key"
          echo "---- OPTIONS preflight check ----"
          curl -s -D - -o /dev/null -X OPTIONS \
            -H "Origin: https://ayoobamiri.github.io" \
            -H "Access-Control-Request-Method: POST" \
            "https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/$APPKEY/probe-key/x"
