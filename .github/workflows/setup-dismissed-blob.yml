name: One-off create dismissed-jobs blob
on: workflow_dispatch
jobs:
  create-blob:
    runs-on: ubuntu-latest
    steps:
      - name: Create jsonblob and print its URL
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -d '[]' -D /tmp/headers.txt https://jsonblob.com/api/jsonBlob -o /tmp/body.txt
          echo "----HEADERS----"
          cat /tmp/headers.txt
          echo "----BODY----"
          cat /tmp/body.txt
          echo "----LOCATION----"
          grep -i '^location:' /tmp/headers.txt
