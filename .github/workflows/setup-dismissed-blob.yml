name: One-off create dismissed-jobs blob
on: workflow_dispatch
jobs:
  create-blob:
    runs-on: ubuntu-latest
    steps:
      - name: Test round-trip set/get using our real app key
        run: |
          APPKEY="j3phzvnq"
          echo "---- UpdateValue ----"
          curl -s -d '' -w '\nHTTP_STATUS:%{http_code}\n' -X POST "https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/$APPKEY/probe-key/%5B%22abc123%22%5D"
          echo "---- GetValue ----"
          curl -s -w '\nHTTP_STATUS:%{http_code}\n' https://keyvalue.immanuel.co/api/KeyVal/GetValue/$APPKEY/probe-key
