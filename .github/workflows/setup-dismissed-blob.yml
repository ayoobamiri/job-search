name: One-off create dismissed-jobs blob
on: workflow_dispatch
jobs:
  create-blob:
    runs-on: ubuntu-latest
    steps:
      - name: Check CORS headers on the actual POST response (not just OPTIONS)
        run: |
          APPKEY="j3phzvnq"
          echo "---- POST UpdateValue with Origin header, no custom headers (mimics a 'simple request' fetch) ----"
          curl -s -d '' -D - -o /dev/null \
            -H "Origin: https://ayoobamiri.github.io" \
            -X POST "https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/$APPKEY/dismissed-ids/%5B%5D"
